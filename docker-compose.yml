services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:4173"
    depends_on:
      - bff

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BFF_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-smart-flow-secret}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Supabase Postgres connection string}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-dev-smart-flow-encryption-key}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-SmartHome <onboarding@resend.dev>}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:5173}"
      NEWS_RSS_FEEDS: "${NEWS_RSS_FEEDS:-https://habr.com/ru/rss/hubs/home_automation/articles/?fl=ru,https://habr.com/ru/rss/hubs/home_automation/news/?fl=ru,https://habr.com/ru/rss/hubs/internet_of_things/articles/?fl=ru,https://habr.com/ru/rss/hubs/internet_of_things/news/?fl=ru}"
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_CACHE_TTL_MS: ${WEATHER_CACHE_TTL_MS:-300000}
      AUTOMATION_INTERVAL_MS: ${AUTOMATION_INTERVAL_MS:-30000}
      CORS_ORIGIN: http://localhost:5173

  kafka:
    image: confluentinc/confluent-local:7.4.3
    profiles: ["kafka"]
    hostname: kafka
    container_name: smart-flow-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      CLUSTER_ID: "K0EA9p0yEe6MkAAAAkKsEg"

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    profiles: ["kafka"]
    container_name: smart-flow-kafka-init
    depends_on:
      - kafka
    command: >
      bash -c "
      kafka-topics --create --topic telemetry.sensors.v1 --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic telemetry.snapshots.v1 --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092 &&
      kafka-topics --create --topic telemetry.hubs.v1 --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092"
    init: true
